# The offline suite runs in R-CMD-check. This workflow additionally downloads
# small real models and runs the end-to-end tests, which is too slow and too
# network-dependent to do on every push.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

name: integration-tests

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RTRANSCRIBE_TEST_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install cmake
        uses: lukka/get-cmake@latest

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::av, any::curl, local::.
          needs: check

      - name: Cache downloaded models
        uses: actions/cache@v4
        with:
          path: ~/.cache/R/rtranscribe
          key: rtranscribe-models-v1

      - name: Run tests with real models
        run: |
          Rscript -e 'testthat::test_local(".", reporter = "summary")'
