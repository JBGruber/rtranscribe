on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: macos-latest,   r: 'release'}
          # No Windows entry: DESCRIPTION declares OS_type: unix, so the
          # package does not install there yet. configure.win is in the tree
          # as the starting point -- add {os: windows-latest, r: 'release'}
          # here at the same time as dropping that OS_type field.

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install cmake
        uses: lukka/get-cmake@latest

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # Compiling the bundled sources is slow; the "installed package size"
          # and "compilation time" notes are expected off-CRAN.
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'

  # The GPU path is opt-in, so nothing above ever compiles it. This job builds
  # it and proves the two things that can be checked without a GPU: that the
  # Vulkan build links, and that it still works on a machine with no Vulkan
  # device (mesa's lavapipe gives the runner a software one, so devices are
  # actually enumerated rather than merely absent).
  #
  # CUDA and Metal have no equivalent job: neither toolkit nor hardware is on
  # a standard runner.
  vulkan-build:
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, vulkan)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TRANSCRIBE_R_VULKAN: 1

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install cmake
        uses: lukka/get-cmake@latest

      - name: Install Vulkan build and runtime dependencies
        run: |
          sudo apt-get update
          # spirv-headers: ggml-vulkan does find_package(SPIRV-Headers CONFIG
          # REQUIRED) and includes <spirv/unified1/spirv.hpp>; those ship
          # separately from the loader on Debian/Ubuntu.
          sudo apt-get install -y libvulkan-dev glslc spirv-headers mesa-vulkan-drivers

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Install with the Vulkan backend
        run: R CMD INSTALL --preclean .

      - name: Smoke test
        run: |
          Rscript -e '
            library(rtranscribe)
            print(transcribe_devices())
            cat("vulkan device:", transcribe_backend_available("vulkan"), "\n")
            # The CPU path must keep working whether or not a Vulkan device
            # showed up -- that is the whole point of a degradable build.
            stopifnot(transcribe_backend_available("cpu"))
          '
